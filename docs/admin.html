<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>DuckLog Admin</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: #f5f5f5; color: #333; }
  .header { background: #FFC843; padding: 16px 24px; display: flex; align-items: center; gap: 12px; }
  .header h1 { font-size: 20px; font-weight: 700; }
  .tabs { display: flex; gap: 8px; padding: 16px 24px 0; }
  .tab { padding: 10px 20px; border: none; background: #ddd; border-radius: 8px 8px 0 0; cursor: pointer; font-size: 14px; font-weight: 600; }
  .tab.active { background: #fff; }
  .content { background: #fff; margin: 0 24px; border-radius: 0 8px 8px 8px; padding: 20px; min-height: 400px; }
  table { width: 100%; border-collapse: collapse; font-size: 13px; }
  th, td { padding: 10px 12px; text-align: left; border-bottom: 1px solid #eee; }
  th { font-weight: 600; background: #fafafa; }
  .btn { padding: 6px 14px; border: none; border-radius: 6px; cursor: pointer; font-size: 12px; font-weight: 600; }
  .btn-danger { background: #ff4444; color: #fff; }
  .btn-success { background: #22c55e; color: #fff; }
  .btn-gray { background: #888; color: #fff; }
  .btn:hover { opacity: 0.85; }
  .empty { padding: 40px; text-align: center; color: #999; }
  .stats { display: flex; gap: 16px; margin-bottom: 20px; }
  .stat-card { background: #f9f9f9; padding: 16px; border-radius: 8px; flex: 1; text-align: center; }
  .stat-card .num { font-size: 28px; font-weight: 700; }
  .stat-card .label { font-size: 12px; color: #888; margin-top: 4px; }
  .error { padding: 20px; text-align: center; color: #ff4444; }
  .login-form { max-width: 360px; margin: 80px auto; text-align: center; }
  .login-form input { width: 100%; padding: 12px 16px; border: 2px solid #ddd; border-radius: 8px; font-size: 14px; margin-bottom: 12px; }
  .login-form input:focus { outline: none; border-color: #FFC843; }
  .login-form button { width: 100%; padding: 12px; background: #FFC843; border: none; border-radius: 8px; font-size: 14px; font-weight: 700; cursor: pointer; }
  .login-form button:hover { opacity: 0.85; }
  .login-form .error-msg { color: #ff4444; font-size: 13px; margin-top: 8px; display: none; }
  .search-bar { display: flex; gap: 8px; margin-bottom: 16px; }
  .search-bar input { flex: 1; padding: 10px 14px; border: 2px solid #ddd; border-radius: 8px; font-size: 14px; }
  .search-bar input:focus { outline: none; border-color: #FFC843; }
  .search-bar button { padding: 10px 20px; background: #FFC843; border: none; border-radius: 8px; font-weight: 700; cursor: pointer; }
  .badge { display: inline-block; padding: 2px 8px; border-radius: 4px; font-size: 11px; font-weight: 600; }
  .badge-pro { background: #FFC843; color: #333; }
  .badge-free { background: #eee; color: #888; }
  .badge-verified { background: #3b82f6; color: #fff; }
  .badge-admin { background: #8b5cf6; color: #fff; }
</style>
</head>
<body>
<div class="header">
  <span style="font-size:28px">&#x1F425;</span>
  <h1>DuckLog Admin Dashboard</h1>
</div>

<div id="login-container">
  <div class="login-form">
    <h2 style="margin-bottom:24px">관리자 로그인</h2>
    <input type="password" id="secret-input" placeholder="Admin Secret" onkeydown="if(event.key==='Enter')doLogin()">
    <button onclick="doLogin()">로그인</button>
    <div class="error-msg" id="login-error">인증에 실패했습니다.</div>
  </div>
</div>

<div id="dashboard-container" style="display:none">
  <div class="tabs">
    <button class="tab active" onclick="showTab('reports')">신고 목록</button>
    <button class="tab" onclick="showTab('suspended')">정지된 유저</button>
    <button class="tab" onclick="showTab('users')">유저 관리</button>
    <button class="tab" onclick="showTab('subscriptions')">구독 관리</button>
  </div>

  <div class="content" id="content">
    <div class="empty">로딩 중...</div>
  </div>
</div>

<script>
const API_BASE = "https://tmndjqefsnccllbgczxv.supabase.co/functions/v1/admin-dashboard";

function getSecret() {
  return sessionStorage.getItem('admin_secret') || '';
}

function doLogin() {
  const input = document.getElementById('secret-input');
  const secret = input.value.trim();
  if (!secret) return;
  sessionStorage.setItem('admin_secret', secret);
  document.getElementById('login-error').style.display = 'none';
  showDashboard();
}

function showLoginForm() {
  sessionStorage.removeItem('admin_secret');
  document.getElementById('login-container').style.display = '';
  document.getElementById('dashboard-container').style.display = 'none';
  document.getElementById('secret-input').value = '';
}

function showDashboard() {
  document.getElementById('login-container').style.display = 'none';
  document.getElementById('dashboard-container').style.display = '';
  loadReports();
}

async function api(action, params = {}) {
  const qs = new URLSearchParams({ action, ...params });
  const method = ['dismiss','unsuspend','suspend','set_verified','set_subscription'].includes(action) ? 'POST' : 'GET';
  const res = await fetch(API_BASE + '?' + qs, {
    method,
    headers: { 'x-admin-secret': getSecret() },
  });
  if (res.status === 401) {
    document.getElementById('login-error').style.display = '';
    showLoginForm();
    throw new Error('Unauthorized');
  }
  return res.json();
}

let currentTab = 'reports';

function showTab(tab) {
  currentTab = tab;
  const tabs = ['reports', 'suspended', 'users', 'subscriptions'];
  document.querySelectorAll('.tab').forEach((t, i) => {
    t.classList.toggle('active', tabs[i] === tab);
  });
  if (tab === 'reports') loadReports();
  else if (tab === 'suspended') loadSuspended();
  else if (tab === 'users') showUserSearch();
  else if (tab === 'subscriptions') loadSubscriptions();
}

const REASON_MAP = {
  inappropriate: '부적절한 콘텐츠',
  spam: '스팸/광고',
  harassment: '괴롭힘/욕설',
  impersonation: '사칭',
  other: '기타'
};

async function loadReports() {
  const el = document.getElementById('content');
  el.innerHTML = '<div class="empty">로딩 중...</div>';

  try {
    const data = await api('reports', { status: 'pending' });

    if (data.error) {
      el.innerHTML = '<div class="error">오류: ' + esc(data.error) + '</div>';
      return;
    }

    if (!data.length) {
      el.innerHTML = '<div class="empty">대기 중인 신고가 없습니다.</div>';
      return;
    }

    el.innerHTML = '<div class="stats">'
      + '<div class="stat-card"><div class="num">' + data.length + '</div><div class="label">대기 중 신고</div></div>'
      + '</div>'
      + '<table><thead><tr>'
      + '<th>신고자</th><th>대상</th><th>사유</th><th>설명</th><th>날짜</th><th>조치</th>'
      + '</tr></thead><tbody>'
      + data.map(r => '<tr>'
        + '<td>' + esc(r.reporter_nickname || '-') + '</td>'
        + '<td>' + esc(r.reported_nickname || '-') + '</td>'
        + '<td>' + (REASON_MAP[r.reason] || r.reason) + '</td>'
        + '<td>' + esc(r.description || '-') + '</td>'
        + '<td>' + new Date(r.created_at).toLocaleDateString('ko') + '</td>'
        + '<td>'
        + '<button class="btn btn-gray" onclick="dismiss(\'' + r.report_id + '\')">기각</button> '
        + '<button class="btn btn-danger" onclick="suspend(\'' + r.reported_user_id + '\')">정지</button>'
        + '</td>'
        + '</tr>').join('')
      + '</tbody></table>';
  } catch (e) {
    el.innerHTML = '<div class="error">API 호출 실패: ' + esc(e.message) + '</div>';
  }
}

async function loadSuspended() {
  const el = document.getElementById('content');
  el.innerHTML = '<div class="empty">로딩 중...</div>';

  try {
    const data = await api('suspended');

    if (data.error) {
      el.innerHTML = '<div class="error">오류: ' + esc(data.error) + '</div>';
      return;
    }

    if (!data.length) {
      el.innerHTML = '<div class="empty">정지된 유저가 없습니다.</div>';
      return;
    }

    el.innerHTML = '<table><thead><tr>'
      + '<th>닉네임</th><th>신고 수</th><th>정지 시점</th><th>조치</th>'
      + '</tr></thead><tbody>'
      + data.map(u => '<tr>'
        + '<td>' + esc(u.nickname || '-') + '</td>'
        + '<td>' + u.report_count + '건</td>'
        + '<td>' + (u.suspended_since ? new Date(u.suspended_since).toLocaleDateString('ko') : '-') + '</td>'
        + '<td><button class="btn btn-success" onclick="unsuspend(\'' + u.user_id + '\')">정지 해제</button></td>'
        + '</tr>').join('')
      + '</tbody></table>';
  } catch (e) {
    el.innerHTML = '<div class="error">API 호출 실패: ' + esc(e.message) + '</div>';
  }
}

async function dismiss(reportId) {
  if (!confirm('이 신고를 기각하시겠습니까?')) return;
  await api('dismiss', { report_id: reportId });
  loadReports();
}

async function suspend(userId) {
  if (!confirm('이 유저를 정지하시겠습니까?')) return;
  await api('suspend', { user_id: userId });
  loadReports();
}

async function unsuspend(userId) {
  if (!confirm('이 유저의 정지를 해제하시겠습니까?')) return;
  await api('unsuspend', { user_id: userId });
  loadSuspended();
}

// ===== 유저 관리 =====
function showUserSearch() {
  const el = document.getElementById('content');
  el.innerHTML = '<div class="search-bar">'
    + '<input type="text" id="user-query" placeholder="닉네임 또는 친구코드 검색" onkeydown="if(event.key===\'Enter\')searchUsers()">'
    + '<button onclick="searchUsers()">검색</button>'
    + '</div>'
    + '<div id="user-results"><div class="empty">닉네임이나 친구코드로 검색하세요.</div></div>';
}

async function searchUsers() {
  const query = document.getElementById('user-query').value.trim();
  if (!query) return;
  const el = document.getElementById('user-results');
  el.innerHTML = '<div class="empty">검색 중...</div>';

  try {
    const data = await api('search_users', { query });
    if (!data.length) {
      el.innerHTML = '<div class="empty">검색 결과가 없습니다.</div>';
      return;
    }
    el.innerHTML = '<table><thead><tr>'
      + '<th>닉네임</th><th>상태</th><th>공식 배지</th><th>구독</th><th>조치</th>'
      + '</tr></thead><tbody>'
      + data.map(u => '<tr>'
        + '<td>' + esc(u.nickname || '-') + '</td>'
        + '<td>' + (u.is_suspended ? '<span class="badge badge-pro">정지됨</span>' : '정상') + '</td>'
        + '<td>' + (u.is_verified ? '<span class="badge badge-verified">공식</span>' : '-') + '</td>'
        + '<td>-</td>'
        + '<td>'
        + (u.is_verified
          ? '<button class="btn btn-gray" onclick="setVerified(\'' + u.id + '\', false)">배지 해제</button>'
          : '<button class="btn btn-success" onclick="setVerified(\'' + u.id + '\', true)">공식 배지 부여</button>')
        + ' '
        + '<button class="btn btn-success" onclick="grantPro(\'' + u.id + '\')">Pro 부여</button> '
        + '<button class="btn btn-gray" onclick="revokePro(\'' + u.id + '\')">Pro 해제</button>'
        + '</td>'
        + '</tr>').join('')
      + '</tbody></table>';
  } catch (e) {
    el.innerHTML = '<div class="error">검색 실패: ' + esc(e.message) + '</div>';
  }
}

async function setVerified(userId, verified) {
  const msg = verified ? '공식 배지를 부여하시겠습니까?' : '공식 배지를 해제하시겠습니까?';
  if (!confirm(msg)) return;
  await api('set_verified', { user_id: userId, verified: String(verified) });
  searchUsers();
}

async function grantPro(userId) {
  if (!confirm('이 유저에게 Pro 구독을 부여하시겠습니까? (1년)')) return;
  await api('set_subscription', { user_id: userId, plan: 'pro' });
  alert('Pro 구독이 부여되었습니다.');
  searchUsers();
}

async function revokePro(userId) {
  if (!confirm('이 유저의 Pro 구독을 해제하시겠습니까?')) return;
  await api('set_subscription', { user_id: userId, plan: 'free' });
  alert('Pro 구독이 해제되었습니다.');
  searchUsers();
}

// ===== 구독 관리 =====
async function loadSubscriptions() {
  const el = document.getElementById('content');
  el.innerHTML = '<div class="empty">로딩 중...</div>';

  try {
    const data = await api('subscriptions');

    if (data.error) {
      el.innerHTML = '<div class="error">오류: ' + esc(data.error) + '</div>';
      return;
    }

    if (!data.length) {
      el.innerHTML = '<div class="empty">구독 중인 유저가 없습니다.</div>';
      return;
    }

    el.innerHTML = '<div class="stats">'
      + '<div class="stat-card"><div class="num">' + data.length + '</div><div class="label">총 구독자</div></div>'
      + '</div>'
      + '<table><thead><tr>'
      + '<th>닉네임</th><th>플랜</th><th>상태</th><th>출처</th><th>만료일</th><th>조치</th>'
      + '</tr></thead><tbody>'
      + data.map(s => '<tr>'
        + '<td>' + esc(s.profiles?.nickname || '-') + '</td>'
        + '<td><span class="badge badge-pro">' + (s.plan || 'pro') + '</span></td>'
        + '<td>' + (s.status || '-') + '</td>'
        + '<td><span class="badge badge-admin">' + (s.source || '-') + '</span></td>'
        + '<td>' + (s.current_period_end ? new Date(s.current_period_end).toLocaleDateString('ko') : '-') + '</td>'
        + '<td><button class="btn btn-gray" onclick="revokeProSub(\'' + s.user_id + '\')">해제</button></td>'
        + '</tr>').join('')
      + '</tbody></table>';
  } catch (e) {
    el.innerHTML = '<div class="error">API 호출 실패: ' + esc(e.message) + '</div>';
  }
}

async function revokeProSub(userId) {
  if (!confirm('이 유저의 구독을 해제하시겠습니까?')) return;
  await api('set_subscription', { user_id: userId, plan: 'free' });
  loadSubscriptions();
}

function esc(s) { const d = document.createElement('div'); d.textContent = s; return d.innerHTML; }

// Auto-login if secret exists in sessionStorage
if (getSecret()) {
  showDashboard();
}
</script>
</body>
</html>
